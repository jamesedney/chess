# Imports a rated slice of the Lichess puzzle database (CC0) and commits the
# rebuilt puzzle set back to the branch. Runs when a commit message on a
# claude/ branch contains [import-puzzles], or manually.
name: Import Lichess puzzles
on:
  push:
    branches: ['claude/**']
  workflow_dispatch:
    inputs:
      count:
        description: Number of puzzles
        default: '3500'
permissions:
  contents: write
jobs:
  import:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[import-puzzles]')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Download the first part of the puzzle database
        run: |
          curl -sSL https://database.lichess.org/lichess_db_puzzle.csv.zst | zstd -dc --long=31 | head -n 1500000 > lichess-puzzles.csv || true
          wc -l lichess-puzzles.csv
          head -n 2 lichess-puzzles.csv
      - name: Sample the puzzles
        run: node tools/import-lichess.mjs --input lichess-puzzles.csv --count "${{ github.event.inputs.count || '3500' }}" --min 400 --max 2400 --max-lines 1500000
      - name: Build the puzzle set
        run: node tools/build-puzzles.mjs --source lichess
      - name: Check the content
        run: node --test test/unit/content.test.mjs test/unit/app-shell.test.mjs
      - name: Commit the result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/puzzles.js tools/data/lichess.json
          git commit -m "Import Lichess puzzle set" -m "Generated by the import-puzzles workflow from database.lichess.org (CC0)." || echo "No changes"
          git push
