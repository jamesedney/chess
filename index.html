<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#f3f1ec" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#262421" media="(prefers-color-scheme: dark)" />
    <meta name="color-scheme" content="light dark" />
    <meta name="description" content="A chess trainer built from your own games: one position at a time." />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Rankup" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="icon" href="./icons/icon-192-bw.png" />
    <link rel="apple-touch-icon" href="./icons/apple-touch-icon-bw.png" />
    <link rel="modulepreload" href="./src/main.js" />
    <link rel="preload" href="./fonts/nunito.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="stylesheet" href="./styles/app.css" />
    <title>Rankup</title>
    <script>
      // Apply the saved appearance before first paint to avoid a flash.
      try {
        var t = localStorage.getItem('rankup-theme');
        if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t;
      } catch (e) {}
    </script>
  </head>
  <body>
    <a class="skip-link" href="#main">Skip to content</a>
    <nav class="tabs" aria-label="Main navigation">
      <span class="brand"><img src="./icons/icon-192-bw.png" alt="" width="26" height="26" />Rankup</span>
      <a href="#train" data-page="train"
        ><svg class="icon" viewBox="0 0 24 24" aria-hidden="true">
          <circle cx="12" cy="12" r="8.5" />
          <circle cx="12" cy="12" r="4.5" />
          <circle cx="12" cy="12" r="0.9" fill="currentColor" /></svg
        ><span>Train</span></a
      >
      <a href="#play" data-page="play"
        ><svg class="icon" viewBox="0 0 24 24" aria-hidden="true">
          <path d="M9 20.5h6M8 17.5h8M9.5 17.5c.3-2.6.3-4.4-.9-6.4h6.8c-1.2 2-1.2 3.8-.9 6.4" />
          <circle cx="12" cy="7" r="3.2" /></svg
        ><span>Play</span></a
      >
      <a href="#you" data-page="you"
        ><svg class="icon" viewBox="0 0 24 24" aria-hidden="true">
          <path d="M4 18.5l5.2-6 3.6 3.4L20 7.5" />
          <path d="M15.5 7.5H20V12" /></svg
        ><span>You</span></a
      >
    </nav>
    <main id="main" tabindex="-1"></main>
    <dialog id="modal" aria-labelledby="modal-content">
      <div id="modal-content"></div>
      <button type="button" id="close-modal" class="btn">Done</button>
    </dialog>
    <dialog id="confirm"></dialog>
    <div id="toast" class="toast" role="status" aria-live="polite"></div>
    <noscript><p style="padding: 20px">Rankup needs JavaScript to run.</p></noscript>
    <script type="module" src="./src/main.js"></script>
  </body>
</html>
