<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#a6521f" />
    <meta name="color-scheme" content="light dark" />
    <meta name="description" content="A guided training plan that takes your chess rating where you want it." />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Rankup" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="icon" href="./icons/icon-192.png" />
    <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png" />
    <link rel="modulepreload" href="./src/main.js" />
    <link rel="stylesheet" href="./styles/app.css" />
    <title>Rankup</title>
    <script>
      // Apply the saved appearance before first paint to avoid a flash.
      try {
        var t = localStorage.getItem('rankup-theme');
        if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t;
      } catch (e) {}
    </script>
  </head>
  <body>
    <a class="skip-link" href="#main">Skip to content</a>
    <header>
      <a class="brand" href="#today" aria-label="Rankup home"
        ><img class="brand-icon" src="./icons/icon-192.png" alt="" width="30" height="30" /> Rankup</a
      >
      <div class="header-right">
        <span id="offline" class="small"></span>
        <button type="button" id="install" class="header-button" hidden>Install app</button>
        <button type="button" id="settings" class="header-button" aria-haspopup="dialog" aria-label="Settings">
          <svg class="icon" viewBox="0 0 24 24" aria-hidden="true">
            <path d="M4 7h9M17 7h3M4 17h3M11 17h9" />
            <circle cx="15" cy="7" r="2" />
            <circle cx="9" cy="17" r="2" /></svg
          ><span class="label">Settings</span>
        </button>
      </div>
    </header>
    <div class="shell">
      <aside class="sidebar">
        <nav aria-label="Main navigation">
          <a href="#today" data-page="today"
            ><svg class="icon" viewBox="0 0 24 24" aria-hidden="true">
              <rect x="3.5" y="5" width="17" height="15.5" rx="2.5" />
              <path d="M3.5 9.5h17M8 3v4M16 3v4M9 14.5l2 2 4-4" /></svg
            ><span>Today</span></a
          >
          <a href="#path" data-page="path"
            ><svg class="icon" viewBox="0 0 24 24" aria-hidden="true">
              <circle cx="6" cy="18" r="2.5" />
              <circle cx="18" cy="6" r="2.5" />
              <path d="M8.5 18H15a3 3 0 0 0 0-6H9a3 3 0 0 1 0-6h6.5" /></svg
            ><span>Path</span></a
          >
          <a href="#play" data-page="play"
            ><svg class="icon" viewBox="0 0 24 24" aria-hidden="true">
              <circle cx="12" cy="12" r="8.5" />
              <path d="M10.2 8.8v6.4l5-3.2z" /></svg
            ><span>Play</span></a
          >
          <a href="#review" data-page="review"
            ><svg class="icon" viewBox="0 0 24 24" aria-hidden="true">
              <path d="M3.5 12a8.5 8.5 0 1 0 2.5-6" />
              <path d="M3.5 4v4h4" />
              <path d="M12 8v4.2l2.8 1.8" /></svg
            ><span>Games</span></a
          >
          <a href="#progress" data-page="progress"
            ><svg class="icon" viewBox="0 0 24 24" aria-hidden="true">
              <circle cx="12" cy="8.5" r="3.5" />
              <path d="M5 20c1.2-3.6 3.8-5.5 7-5.5s5.8 1.9 7 5.5" /></svg
            ><span>You</span></a
          >
        </nav>
        <div class="sidebar-bottom">
          <div class="goal-line" aria-hidden="true"><span id="goal-bar"></span></div>
          <small id="goal-text">Puzzle rating</small>
        </div>
      </aside>
      <div class="content">
        <div id="session-bar" class="session-bar" role="region" aria-label="Today’s session" hidden></div>
        <main id="main" tabindex="-1"></main>
      </div>
    </div>
    <dialog id="modal" aria-labelledby="modal-content">
      <div id="modal-content"></div>
      <button type="button" id="close-modal" class="secondary">Close</button>
    </dialog>
    <dialog id="confirm"></dialog>
    <div id="toast" role="status" aria-live="polite"></div>
    <noscript><p style="padding: 20px">Rankup needs JavaScript to run.</p></noscript>
    <script type="module" src="./src/main.js"></script>
  </body>
</html>
